spring:
  application:
    name: findme
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:findme}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  seed:
    moderador:
      email: ${SEED_MODERADOR_EMAIL:moderador@findme.com}
      senha: ${SEED_MODERADOR_SENHA:Moderador@123}
    responsavel:
      email: ${SEED_RESPONSAVEL_EMAIL:responsavel@findme.com}
      senha: ${SEED_RESPONSAVEL_SENHA:Responsavel@123}
    colaborador:
      email: ${SEED_COLABORADOR_EMAIL:colaborador@findme.com}
      senha: ${SEED_COLABORADOR_SENHA:Colaborador@123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true

info:
  app:
    name: Find Me API
    description: API REST do Find Me (CitizenTech) - divulgacao responsavel de desaparecimentos
    version: 0.0.1