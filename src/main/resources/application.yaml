spring:
  application:
    name: findme
  datasource:
    url: jdbc:h2:file:./data/findme
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:ZmluZG1lLWRldi1zZWNyZXQta2V5LWF0LWxlYXN0LTMyLWJ5dGVzIQ==}
    expiration-ms: 3600000
  seed:
    moderador:
      email: ${SEED_MODERADOR_EMAIL:moderador@findme.com}
      senha: ${SEED_MODERADOR_SENHA:Moderador@123}
    responsavel:
      email: ${SEED_RESPONSAVEL_EMAIL:responsavel@findme.com}
      senha: ${SEED_RESPONSAVEL_SENHA:Responsavel@123}
    colaborador:
      email: ${SEED_COLABORADOR_EMAIL:colaborador@findme.com}
      senha: ${SEED_COLABORADOR_SENHA:Colaborador@123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true

info:
  app:
    name: Find Me API
    description: API REST do Find Me (CitizenTech) - divulgacao responsavel de desaparecimentos
    version: 0.0.1